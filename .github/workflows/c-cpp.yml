name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-x86-64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test for compile
      run: make test

    - name: Test with nopic
      run: make test-nopic

    - name: Test for self hosting
      run: make test-stage2

    - name: Check a diff between stage2 and stage3 compiler
      run: make test-stage3

  test-riscv-64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install RISC-V test tools
      run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user

    - name: Test with QEMU
      run: make test-riscv
